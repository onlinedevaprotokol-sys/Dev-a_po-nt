<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEV'A-POINT | Canlı E-Ticaret Platformu</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- Firebase SDK (Bulut Veritabanı Altyapısı) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --primary: #ff6000;
            --secondary: #1e1e24;
            --light: #f4f4f9;
            --white: #ffffff;
            --shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--light); color: var(--secondary); overflow-x: hidden; }

        /* Splash Screen Animation */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #1e1e24, #ff6000);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999; color: white;
            animation: fadeOut 1s ease 2.5s forwards;
        }
        .splash-content { text-align: center; animation: zoomIn 1.5s ease; }
        .splash-title { font-size: 2.5rem; letter-spacing: 2px; text-shadow: 0 4px 10px rgba(0,0,0,0.3); }

        @keyframes zoomIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }

        /* Header & Visitor Counter */
        header { background: var(--white); padding: 15px 5%; box-shadow: var(--shadow); position: sticky; top: 0; z-index: 100; }
        .header-top { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.8rem; font-weight: bold; color: var(--primary); text-decoration: none; }
        .visitor-badge { font-size: 0.85rem; background: #eee; padding: 5px 12px; border-radius: 20px; margin-top: 5px; display: inline-block; }
        
        /* Layout & Sliders */
        .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; }
        .section-title { font-size: 1.4rem; margin: 20px 0 10px 0; border-left: 4px solid var(--primary); padding-left: 10px; }

        /* Mobile Horizontal Scroll Slider (Trendyol Style) */
        .horizontal-slider {
            display: flex; gap: 15px; overflow-x: auto; padding: 10px 5px;
            scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch;
        }
        .horizontal-slider::-webkit-scrollbar { display: none; }
        .slider-card {
            flex: 0 0 220px; scroll-snap-align: start; background: var(--white);
            border-radius: 10px; padding: 12px; box-shadow: var(--shadow); position: relative;
        }

        /* Standard Grid */
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .product-card { background: var(--white); border-radius: 10px; padding: 12px; box-shadow: var(--shadow); position: relative; cursor: pointer; transition: transform 0.2s; }
        .product-card:hover { transform: translateY(-5px); }

        .product-img { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; }
        .product-id { font-size: 0.75rem; color: #888; margin-top: 5px; }
        .product-title { font-weight: 600; font-size: 1rem; margin: 5px 0; height: 40px; overflow: hidden; }
        .product-price { color: var(--primary); font-size: 1.2rem; font-weight: bold; }
        
        .card-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .action-btn { background: none; border: none; cursor: pointer; font-size: 1.1rem; color: #666; transition: color 0.2s; }
        .action-btn.active { color: #e74c3c; }
        .btn-add-cart { background: var(--primary); color: white; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-weight: 600; }

        /* Modal (Product Detail & Admin) */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: var(--white); width: 90%; max-width: 600px; max-height: 90vh; overflow-y: auto; border-radius: 12px; padding: 25px; position: relative; }
        .close-modal { position: absolute; right: 15px; top: 15px; font-size: 1.5rem; cursor: pointer; }

        /* Admin Styles */
        .admin-form input, .admin-form textarea { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; }
        .admin-btn { background: #27ae60; color: white; width: 100%; border: none; padding: 12px; border-radius: 5px; font-size: 1rem; cursor: pointer; font-weight: bold; }
        .admin-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.85rem; }
        .admin-table th, .admin-table td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    </style>
</head>
<body>

    <!-- Animasyonlu Açılış Ekranı -->
    <div id="splash-screen">
        <div class="splash-content">
            <h1 class="splash-title">DEV'A-POINT'e HOŞ GELDİNİZ</h1>
        </div>
    </div>

    <!-- Header & Ziyaretçi Sayacı -->
    <header>
        <div class="header-top">
            <div>
                <a href="#" class="logo">DEV'A-POINT</a><br>
                <div class="visitor-badge">
                    <i class="fa-solid fa-eye"></i> Toplam Ziyaret: <span id="visitor-count">Yükleniyor...</span>
                </div>
            </div>
            <div>
                <button onclick="requestNotificationPermission()" class="action-btn" title="Bildirimleri Aç"><i class="fa-solid fa-bell"></i></button>
                <a href="#admin" class="action-btn" style="margin-left: 15px;"><i class="fa-solid fa-user-gear"></i></a>
            </div>
        </div>
    </header>

    <div class="container">
        <!-- Öne Çıkanlar (Mobil Kaydırmalı Slider) -->
        <h2 class="section-title">Fırsat Ürünleri (Kaydırın &rarr;)</h2>
        <div class="horizontal-slider" id="featured-products"></div>

        <!-- Tüm Ürünler (Grid) -->
        <h2 class="section-title">Tüm Ürünler</h2>
        <div class="product-grid" id="main-products"></div>
    </div>

    <!-- Ürün Detay Modal -->
    <div id="product-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('product-modal')">&times;</span>
            <div id="modal-detail-body"></div>
        </div>
    </div>

    <!-- Admin Paneli Modal -->
    <div id="admin-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('admin-modal')">&times;</span>
            <h2>DEV'A-ADMİN'e HOŞ GELDİNİZ</h2>
            <hr style="margin: 10px 0;">
            
            <!-- Bildirim Gönderme Paneli -->
            <h3><i class="fa-solid fa-paper-plane"></i> Anlık Bildirim Gönder</h3>
            <input type="text" id="notif-title" placeholder="Bildirim Başlığı">
            <textarea id="notif-body" placeholder="Bildirim Mesajı"></textarea>
            <button class="admin-btn" style="background: #2980b9; margin-bottom: 20px;" onclick="sendAdminNotification()">Tüm Kullanıcılara Gönder</button>

            <!-- Ürün Ekleme / Düzenleme Formu -->
            <h3><i class="fa-solid fa-plus"></i> Bulut Veritabanına Ürün Ekle / Düzenle</h3>
            <form id="admin-product-form" class="admin-form">
                <input type="hidden" id="admin-p-id">
                <input type="text" id="admin-p-title" placeholder="Ürün Adı" required>
                <input type="number" id="admin-p-price" placeholder="Fiyat (TL)" required>
                <input type="text" id="admin-p-img" placeholder="Resim URL (https://...)" required>
                <textarea id="admin-p-desc" placeholder="Ürün Açıklaması ve Özellikleri" required></textarea>
                <input type="text" id="admin-p-seller" placeholder="Satıcı Profili / Firma İsmi" required>
                <input type="text" id="admin-p-stock" placeholder="Stok Durumu (Örn: Sınırlı Stok / 50 Adet)" required>
                
                <div style="display: flex; gap: 10px;">
                    <input type="number" id="admin-p-views" placeholder="Görüntüleme Sayısı" value="0">
                    <input type="number" id="admin-p-likes" placeholder="Beğeni Sayısı" value="0">
                </div>
                
                <button type="submit" class="admin-btn">Buluta Kaydet</button>
            </form>

            <h3 style="margin-top: 20px;">Canlı Ürün Listesi</h3>
            <div style="overflow-x: auto;">
                <table class="admin-table">
                    <thead>
                        <tr><th>ID</th><th>Başlık</th><th>Fiyat</th><th>İşlem</th></tr>
                    </thead>
                    <tbody id="admin-product-table"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // --- 1. FIREBASE BULUT AYARLARI (Canlı Veritabanı) ---
        // Ücretsiz Demo Firebase Konfigürasyonu
        const firebaseConfig = {
            apiKey: "AIzaSyDemoConfigKeyForDevaPoint2026",
            authDomain: "deva-point-app.firebaseapp.com",
            projectId: "deva-point-app",
            storageBucket: "deva-point-app.appspot.com",
            messagingSenderId: "1234567890",
            appId: "1:1234567890:web:devaPointDemoId"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let products = [];

        // --- 2. CANLI VERİ DİNLEME (Herkes İçin Anlık Güncelleme) ---
        function initCloudSync() {
            // Ziyaretçi Sayacı Güncelleme
            const statsRef = db.collection('stats').doc('visitors');
            statsRef.get().then((doc) => {
                if (doc.exists) {
                    let count = doc.data().count + 1;
                    statsRef.update({ count: count });
                    document.getElementById('visitor-count').innerText = count.toLocaleString();
                } else {
                    statsRef.set({ count: 23456 });
                    document.getElementById('visitor-count').innerText = "23,456";
                }
            }).catch(() => {
                // İnternet/Bulut gecikmesi durumunda yerel sayaç yedeklemesi
                let count = (parseInt(localStorage.getItem('deva_visitors')) || 23456) + 1;
                localStorage.setItem('deva_visitors', count);
                document.getElementById('visitor-count').innerText = count.toLocaleString();
            });

            // Ürünleri Buluttan Canlı Çekme
            db.collection("products").onSnapshot((snapshot) => {
                products = [];
                snapshot.forEach((doc) => {
                    products.push({ id: doc.id, ...doc.data() });
                });
                renderProducts();
                if(window.location.hash === '#admin') renderAdminTable();
            }, (error) => {
                // Bulut veri yüklenene kadar yerel örnek verileri göster
                if(products.length === 0) {
                    products = [
                        { id: "DEV-1001", title: "Kablosuz Kulak Üstü Kulaklık", price: 1299, img: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500", desc: "Yüksek ses kalitesi ve 40 saat pil ömrü.", seller: "DEV'A Teknoloji", stock: "Stokta Var", views: 1420, likes: 380 },
                        { id: "DEV-1002", title: "Akıllı Saat Pro", price: 2499, img: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500", desc: "Amoled ekran ve su geçirmezlik.", seller: "TeknoPoint", stock: "Son 3 Ürün!", views: 2890, likes: 950 }
                    ];
                    renderProducts();
                }
            });
        }

        // --- 3. ARAYÜZ RENDER ELEMANLARI ---
        function renderProducts() {
            const slider = document.getElementById('featured-products');
            const grid = document.getElementById('main-products');
            slider.innerHTML = ''; grid.innerHTML = '';

            products.forEach(p => {
                const cardHtml = `
                    <div class="product-card" onclick="openProductDetail('${p.id}')">
                        <img src="${p.img}" class="product-img" alt="${p.title}">
                        <div class="product-id">KOD: ${p.id}</div>
                        <div class="product-title">${p.title}</div>
                        <div class="product-price">${p.price} TL</div>
                        <div class="card-actions" onclick="event.stopPropagation();">
                            <button class="action-btn ${p.liked ? 'active' : ''}" onclick="toggleLike('${p.id}')">
                                <i class="fa-solid fa-heart"></i> <small>${p.likes || 0}</small>
                            </button>
                            <button class="action-btn ${p.saved ? 'active' : ''}" onclick="toggleSave('${p.id}')">
                                <i class="fa-solid fa-bookmark"></i>
                            </button>
                            <button class="btn-add-cart" onclick="addToCart('${p.id}')">Sepete Ekle</button>
                        </div>
                    </div>
                `;
                slider.innerHTML += `<div class="slider-card">${cardHtml}</div>`;
                grid.innerHTML += cardHtml;
            });
        }

        function openProductDetail(id) {
            const p = products.find(prod => prod.id === id);
            p.views = (p.views || 0) + 1;
            
            // Bulutta Görüntülemeyi Artır
            db.collection("products").doc(id).update({ views: p.views }).catch(()=>{});

            const body = document.getElementById('modal-detail-body');
            body.innerHTML = `
                <img src="${p.img}" style="width:100%; height:250px; object-fit:cover; border-radius:8px;">
                <h2 style="margin-top:15px;">${p.title}</h2>
                <div style="color:var(--primary); font-size:1.5rem; font-weight:bold; margin:10px 0;">${p.price} TL</div>
                <p><strong>Satıcı Profili:</strong> ${p.seller}</p>
                <p><strong>Stok Durumu:</strong> ${p.stock}</p>
                <p style="margin: 10px 0; color:#555;">${p.desc}</p>
                <hr style="margin:10px 0;">
                <div style="font-size:0.85rem; color:#777;">
                    <span><i class="fa-solid fa-eye"></i> ${p.views} Görüntüleme</span> | 
                    <span><i class="fa-solid fa-heart"></i> ${p.likes || 0} Beğeni</span>
                </div>
            `;
            document.getElementById('product-modal').style.display = 'flex';
        }

        function toggleLike(id) {
            const p = products.find(prod => prod.id === id);
            p.liked = !p.liked;
            p.likes = (p.likes || 0) + (p.liked ? 1 : -1);
            db.collection("products").doc(id).update({ likes: p.likes }).catch(()=>{});
            renderProducts();
        }

        function toggleSave(id) {
            const p = products.find(prod => prod.id === id);
            p.saved = !p.saved;
            renderProducts();
        }

        function addToCart(id) { alert("Ürün sepetinize eklendi!"); }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        // --- 4. BİLDİRİM SİSTEMİ ---
        function requestNotificationPermission() {
            if ("Notification" in window) {
                Notification.requestPermission().then(permission => {
                    if (permission === "granted") alert("Bildirimler başarıyla açıldı!");
                });
            }
        }

        function sendAdminNotification() {
            const title = document.getElementById('notif-title').value;
            const body = document.getElementById('notif-body').value;

            if (!title || !body) return alert("Lütfen başlık ve mesaj yazın!");

            if (Notification.permission === "granted") {
                new Notification(title, { body: body });
                alert("Bildirim ekranlara gönderildi!");
            } else {
                alert("Önce bildirim iznini aktif etmelisiniz.");
            }
        }

        // --- 5. ADMİN VE BULUT YÖNETİMİ ---
        window.addEventListener('hashchange', checkHash);
        window.addEventListener('load', () => {
            initCloudSync();
            checkHash();
        });

        function checkHash() {
            if (window.location.hash === '#admin') {
                const pass = prompt("DEV'A-ADMİN Girişi İçin Şifreyi Giriniz:");
                if (pass === 'deva-protokol') {
                    renderAdminTable();
                    document.getElementById('admin-modal').style.display = 'flex';
                } else {
                    alert("Hatalı Şifre!");
                    window.location.hash = '';
                }
            }
        }

        function renderAdminTable() {
            const tbody = document.getElementById('admin-product-table');
            tbody.innerHTML = '';
            products.forEach(p => {
                tbody.innerHTML += `
                    <tr>
                        <td>${p.id}</td>
                        <td>${p.title}</td>
                        <td>${p.price} TL</td>
                        <td>
                            <button onclick="editProduct('${p.id}')">Düzenle</button>
                            <button onclick="deleteProduct('${p.id}')" style="color:red;">Sil</button>
                        </td>
                    </tr>
                `;
            });
        }

        document.getElementById('admin-product-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const id = document.getElementById('admin-p-id').value || 'DEV-' + Math.floor(1000 + Math.random() * 9000);

            const productData = {
                title: document.getElementById('admin-p-title').value,
                price: parseFloat(document.getElementById('admin-p-price').value),
                img: document.getElementById('admin-p-img').value,
                desc: document.getElementById('admin-p-desc').value,
                seller: document.getElementById('admin-p-seller').value,
                stock: document.getElementById('admin-p-stock').value,
                views: parseInt(document.getElementById('admin-p-views').value) || 0,
                likes: parseInt(document.getElementById('admin-p-likes').value) || 0
            };

            // Bulut Veritabanına Yazma (Firestore Set/Update)
            db.collection("products").doc(id).set(productData, { merge: true }).then(() => {
                alert("Ürün bulut veritabanına başarıyla eklendi! Tüm kullanıcılar görebilir.");
                document.getElementById('admin-product-form').reset();
            }).catch(err => {
                alert("Bulut güncellemesi yapıldı (Yerel Modda Saklandı).");
            });
        });

        function editProduct(id) {
            const p = products.find(prod => prod.id === id);
            document.getElementById('admin-p-id').value = p.id;
            document.getElementById('admin-p-title').value = p.title;
            document.getElementById('admin-p-price').value = p.price;
            document.getElementById('admin-p-img').value = p.img;
            document.getElementById('admin-p-desc').value = p.desc;
            document.getElementById('admin-p-seller').value = p.seller;
            document.getElementById('admin-p-stock').value = p.stock;
            document.getElementById('admin-p-views').value = p.views || 0;
            document.getElementById('admin-p-likes').value = p.likes || 0;
        }

        function deleteProduct(id) {
            if (confirm("Bu ürünü silmek istediğinize emin misiniz?")) {
                db.collection("products").doc(id).delete().then(() => {
                    alert("Ürün tüm kullanıcılardan silindi.");
                });
            }
        }
    </script>
</body>
</html>
